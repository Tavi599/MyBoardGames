# Публікує сторінку на GitHub Pages при кожному пуші в main.
#
# Навіщо workflow, коли Pages вмикається двома кліками в налаштуваннях:
# у браузері ті кліки мовчки не спрацьовували (розширення ламало форми
# GitHub). Тут Pages вмикає крок configure-pages з enablement: true,
# користуючись правами самого запуску, — жодних форм і жодних токенів.
name: Публікація сторінки

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Дві збірки поспіль не мають ставати одна одній на п'яти.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Забрати репозиторій
        uses: actions/checkout@v4

      - name: Увімкнути Pages, якщо ще не ввімкнено
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Зібрати теку сайту
        # Назовні йде тільки сторінка та її прикраси: скрипти, дані й
        # службові файли репозиторію на сайті не потрібні.
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png _site/

      - name: Спакувати
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Опублікувати
        id: publish
        uses: actions/deploy-pages@v4
