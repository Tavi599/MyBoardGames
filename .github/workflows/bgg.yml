# Числа з BGG для коробок, які їх ще не мають.
#
# Нащо це тут, а не в браузері: BGG не пускає сторінку до себе (CORS), і
# пошуку за назвою більше не віддає нікому. Зате звернення за числовим id
# з боку сервера працює — а сервером тут виступає сам репозиторій. Отже,
# коробку можна додати з телефона будь-де, а склад столу, час, вага,
# жанри й обкладинка приїдуть самі, поки ти займаєшся своїм.
#
# Два розклади:
#   щодня      добрати те, чого бракує. Коли бракує нічого — жодного
#              звернення до BGG, і робота триває секунди.
#   першого    освіжити все: середня оцінка й ранг на BGG пливуть.
# Плюс кнопка «Run workflow» у вкладці Actions — коли чекати не хочеться.
name: Числа з BGG

on:
  schedule:
    - cron: "17 4 * * *"      # щодня о 4:17 UTC
    - cron: "41 4 1 * *"      # першого числа — з освіженням
  # Правка самого файла дії — це і є привід запустити її раз: інакше
  # перше справжнє випробування було б аж уночі, наосліп.
  push:
    paths:
      - ".github/workflows/bgg.yml"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Освіжити й те, що вже є (оцінка, ранг, опитування)"
        type: boolean
        default: false

# Дії дозволено писати в репозиторій — інакше нічим закомітити знайдене.
permissions:
  contents: write

# Двом однаковим запускам тут нема чого робити: другий лише зіткнеться
# з першим на пуші.
concurrency:
  group: bgg
  cancel-in-progress: false

jobs:
  добрати:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Телефон пише в цей самий файл, і поки ми ходили по BGG, він міг
      # устигнути. Тому весь захід — від свіжого стану до пуша — робимо
      # в кілька спроб: скрипт ідемпотентний, повторити його безпечно.
      - name: Добрати числа й закомітити
        # Імена змінних тут латиною не з примхи: оболонка інших не приймає
        # («not a valid identifier»), хоч би що було в решті репозиторію.
        env:
          REFRESH: ${{ inputs.refresh || github.event.schedule == '41 4 1 * *' }}
        run: |
          set -euo pipefail
          git config user.name "Полиця"
          git config user.email "noreply@github.com"

          for try in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"

            if [ "${REFRESH}" = "true" ]; then
              python "бгг.py" --усі
            else
              python "бгг.py"
            fi

            if git diff --quiet -- "оцінки.json"; then
              echo "Нічого нового: коміт не потрібен."
              exit 0
            fi

            # Зламаного не комітимо навіть від себе.
            python "перевірка.py"

            git add -- "оцінки.json"
            git commit -m "Числа з BGG: добрано автоматично

          Склад столу, тривалість, вага, жанри й обкладинки для коробок,
          у яких їх бракувало. Мітку updated не піднято навмисно: інакше
          цей коміт переміг би правку, що чекає в черзі на телефоні."

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Хтось устиг раніше — пробуємо ще раз (${try}/3)."
            sleep 5
          done

          echo "Тричі не вдалося запушити: спробуємо наступного разу." >&2
          exit 1
